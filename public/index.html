<title>Davvinci</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --font-display:'Manrope','Segoe UI',system-ui,sans-serif;
    --font-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
    --font-mono:'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace;

    --bg:#F2F4F7;
    --surface:#FFFFFF;
    --surface-2:#F7F8FA;
    --surface-hover:#EEF1F5;
    --ink:#12141C;
    --ink-muted:#5B6472;
    --ink-faint:#8891A0;
    --border:rgba(18,20,28,0.10);
    --border-strong:rgba(18,20,28,0.18);

    --brand-ink:#1B2140;
    --brand-ink-2:#2A3363;
    --brand-ink-soft:#EEF0F7;
    --brand-accent:#B8873A;
    --brand-accent-strong:#9A6E28;
    --brand-accent-soft:#F3E7D2;
    --brand-on-ink:#F3F0E8;

    --shadow-sm:0 1px 2px rgba(18,20,28,0.07);
    --shadow-md:0 10px 28px rgba(18,20,28,0.12);

    --status-good:#0ca30c;
    --status-good-text:#006300;
    --status-warning:#c98100;
    --status-serious:#c4552b;
    --status-critical:#d03b3b;

    --cat-1:#2a78d6;
    --cat-2:#eb6834;
    --cat-3:#1baf7a;
    --cat-4:#eda100;
    --cat-5:#4a3aa7;

    --chart-grid:#e6e5e0;
    --chart-axis:#c3c2b7;

    --r-sm:8px; --r-md:12px; --r-lg:18px; --r-xl:22px;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0E1116; --surface:#171B24; --surface-2:#1D2230; --surface-hover:#242A3A;
      --ink:#F4F5F7; --ink-muted:#9AA3B2; --ink-faint:#6B7383;
      --border:rgba(244,245,247,0.10); --border-strong:rgba(244,245,247,0.20);
      --brand-ink:#12162A; --brand-ink-2:#232C52; --brand-ink-soft:#1B2140;
      --brand-accent:#D3A15A; --brand-accent-strong:#E4B978; --brand-accent-soft:#3A2F1C;
      --brand-on-ink:#F3F0E8;
      --shadow-sm:0 1px 2px rgba(0,0,0,0.35); --shadow-md:0 14px 32px rgba(0,0,0,0.5);
      --status-good:#28c728; --status-good-text:#3fdc3f;
      --status-warning:#fab219; --status-serious:#ec835a; --status-critical:#e66767;
      --cat-1:#3987e5; --cat-2:#d95926; --cat-3:#199e70; --cat-4:#c98500; --cat-5:#9085e9;
      --chart-grid:#2c2c2a; --chart-axis:#3a3a37;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E1116; --surface:#171B24; --surface-2:#1D2230; --surface-hover:#242A3A;
    --ink:#F4F5F7; --ink-muted:#9AA3B2; --ink-faint:#6B7383;
    --border:rgba(244,245,247,0.10); --border-strong:rgba(244,245,247,0.20);
    --brand-ink:#12162A; --brand-ink-2:#232C52; --brand-ink-soft:#1B2140;
    --brand-accent:#D3A15A; --brand-accent-strong:#E4B978; --brand-accent-soft:#3A2F1C;
    --brand-on-ink:#F3F0E8;
    --shadow-sm:0 1px 2px rgba(0,0,0,0.35); --shadow-md:0 14px 32px rgba(0,0,0,0.5);
    --status-good:#28c728; --status-good-text:#3fdc3f;
    --status-warning:#fab219; --status-serious:#ec835a; --status-critical:#e66767;
    --cat-1:#3987e5; --cat-2:#d95926; --cat-3:#199e70; --cat-4:#c98500; --cat-5:#9085e9;
    --chart-grid:#2c2c2a; --chart-axis:#3a3a37;
    color-scheme:dark;
  }

  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--font-body); font-size:14px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:var(--font-display); font-weight:800; margin:0; text-wrap:balance; letter-spacing:-0.01em;}
  button{font-family:inherit;}
  table{border-collapse:collapse;}
  ::selection{background:var(--brand-accent-soft);}
  :focus-visible{outline:2px solid var(--brand-accent); outline-offset:2px;}
  @media (prefers-reduced-motion:reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

  .num{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}

  /* ---------- shell layout ---------- */
  #app{min-height:100vh;}
  #shell{display:grid; grid-template-columns:248px 1fr; grid-template-rows:64px 1fr; min-height:100vh;}
  #sidebar{grid-row:1/3; background:var(--brand-ink); color:var(--brand-on-ink); display:flex; flex-direction:column; padding:18px 14px; gap:22px; position:sticky; top:0; height:100vh; overflow-y:auto;}
  #topbar{grid-column:2; display:flex; align-items:center; justify-content:space-between; gap:16px; padding:0 26px; background:var(--surface); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:5;}
  #main{grid-column:2; padding:26px 28px 56px; min-width:0;}
  .view{display:flex; flex-direction:column; gap:22px; max-width:1180px;}

  /* ---------- brand ---------- */
  .brand{display:flex; align-items:center; gap:10px; padding:2px 8px 10px; border-bottom:1px solid rgba(244,240,232,0.12);}
  .brand-mark{width:34px; height:34px; flex:none;}
  .brand-word{font-family:var(--font-display); font-weight:800; font-size:17.5px; letter-spacing:-0.01em; color:#fff;}
  .brand-sub{font-size:10.5px; color:rgba(244,240,232,0.55); letter-spacing:.06em; text-transform:uppercase; margin-top:1px;}

  /* ---------- nav ---------- */
  nav.navlist{display:flex; flex-direction:column; gap:2px;}
  .nav-group-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:rgba(244,240,232,0.42); padding:14px 10px 6px;}
  .nav-item{display:flex; align-items:center; gap:11px; padding:9px 10px; border-radius:10px; color:rgba(244,240,232,0.78); background:none; border:none; cursor:pointer; text-align:left; font-size:13.5px; font-weight:500; width:100%;}
  .nav-item svg{flex:none; opacity:.85;}
  .nav-item:hover{background:rgba(244,240,232,0.08); color:#fff;}
  .nav-item.active{background:var(--brand-ink-2); color:#fff;}
  .nav-item.active svg{opacity:1; color:var(--brand-accent);}
  .sidebar-foot{margin-top:auto; padding-top:14px; border-top:1px solid rgba(244,240,232,0.12); font-size:11.5px; color:rgba(244,240,232,0.5);}

  /* ---------- topbar ---------- */
  .page-title{font-size:16px;}
  .page-eyebrow{font-size:11.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.07em; margin-bottom:2px;}
  .role-switch{display:flex; background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:3px; gap:2px;}
  .role-switch button{border:none; background:none; padding:6px 13px; border-radius:999px; font-size:12.5px; font-weight:600; color:var(--ink-muted); cursor:pointer;}
  .role-switch button.active{background:var(--brand-ink); color:#fff;}
  .topbar-right{display:flex; align-items:center; gap:12px;}
  .avatar{width:32px; height:32px; border-radius:50%; background:var(--brand-accent); color:#241a08; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12.5px; font-family:var(--font-display); flex:none;}
  .whoami{display:flex; flex-direction:column; line-height:1.25;}
  .whoami b{font-size:12.5px;}
  .whoami span{font-size:11px; color:var(--ink-faint);}
  .preview-picker{font-size:12px; padding:6px 8px; border-radius:8px;}

  /* ---------- generic components ---------- */
  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); box-shadow:var(--shadow-sm);}
  .card-pad{padding:18px 20px;}
  .card-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:2px;}
  .card-title{font-family:var(--font-display); font-weight:700; font-size:14.5px;}
  .card-note{font-size:12px; color:var(--ink-faint);}

  .kpi-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
  .kpi{background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); padding:16px 18px; box-shadow:var(--shadow-sm); display:flex; flex-direction:column; gap:6px;}
  .kpi-label{font-size:12px; color:var(--ink-muted); font-weight:500;}
  .kpi-value{font-family:var(--font-mono); font-size:26px; font-weight:600; letter-spacing:-0.01em;}
  .kpi-delta{font-size:11.5px; font-weight:600; display:flex; align-items:center; gap:4px;}
  .kpi-delta.good{color:var(--status-good-text);}
  .kpi-delta.warn{color:var(--status-warning);}

  .grid-2{display:grid; grid-template-columns:1.3fr 1fr; gap:16px; align-items:start;}
  .grid-2-rev{display:grid; grid-template-columns:1fr 1.5fr; gap:16px; align-items:start;}

  .btn{display:inline-flex; align-items:center; gap:7px; border-radius:10px; border:1px solid var(--border-strong); background:var(--surface); color:var(--ink); font-size:13px; font-weight:600; padding:8px 14px; cursor:pointer;}
  .btn:hover{background:var(--surface-hover);}
  .btn-primary{background:var(--brand-ink); border-color:var(--brand-ink); color:#fff;}
  .btn-primary:hover{background:var(--brand-ink-2);}
  .btn-accent{background:var(--brand-accent); border-color:var(--brand-accent); color:#241a08;}
  .btn-accent:hover{background:var(--brand-accent-strong);}
  .btn-danger{background:var(--status-critical); border-color:var(--status-critical); color:#fff;}
  .btn-danger:hover{filter:brightness(1.08);}
  .btn-ghost{background:none; border-color:transparent;}
  .btn-ghost:hover{background:var(--surface-hover);}
  .btn-sm{padding:5px 10px; font-size:12px; border-radius:8px;}
  .btn[disabled]{opacity:.45; cursor:not-allowed;}
  .btn-block{width:100%; justify-content:center;}

  .badge{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:999px; border:1px solid transparent;}
  .badge-dot{width:6px; height:6px; border-radius:50%; flex:none;}
  .badge.good{background:rgba(12,163,12,0.12); color:var(--status-good-text);}
  .badge.good .badge-dot{background:var(--status-good);}
  .badge.warn{background:rgba(201,129,0,0.13); color:var(--status-warning);}
  .badge.warn .badge-dot{background:var(--status-warning);}
  .badge.serious{background:rgba(196,85,43,0.13); color:var(--status-serious);}
  .badge.serious .badge-dot{background:var(--status-serious);}
  .badge.critical{background:rgba(208,59,59,0.12); color:var(--status-critical);}
  .badge.critical .badge-dot{background:var(--status-critical);}
  .badge.neutral{background:var(--surface-2); color:var(--ink-muted); border-color:var(--border);}
  .badge.neutral .badge-dot{background:var(--ink-faint);}

  .table-wrap{overflow-x:auto; border-radius:var(--r-lg); border:1px solid var(--border);}
  table.data{width:100%; border-collapse:collapse; font-size:13px; background:var(--surface);}
  table.data th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); font-weight:600; padding:10px 14px; background:var(--surface-2); border-bottom:1px solid var(--border); white-space:nowrap;}
  table.data td{padding:11px 14px; border-bottom:1px solid var(--border); vertical-align:middle;}
  table.data tr:last-child td{border-bottom:none;}
  table.data tr:hover td{background:var(--surface-2);}

  .toolbar{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;}
  .toolbar-title{display:flex; flex-direction:column; gap:2px;}
  .toolbar-actions{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .filter-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}

  .empty-note{padding:16px; font-size:13px; color:var(--ink-faint);}
  .locked-card{padding:30px 20px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:10px; color:var(--ink-muted);}
  .locked-card svg{opacity:.55;}

  select, input[type="text"], input[type="tel"], input[type="email"], input[type="password"], input[type="search"]{
    font-family:inherit; font-size:13px; padding:8px 10px; border-radius:9px; border:1px solid var(--border-strong); background:var(--surface); color:var(--ink);
  }
  label.field{display:flex; flex-direction:column; gap:5px; font-size:12.5px; font-weight:600; color:var(--ink-muted);}
  fieldset{border:none; padding:0; margin:0; display:flex; flex-direction:column; gap:12px;}
  .check-grid{display:flex; flex-wrap:wrap; gap:8px;}
  .check-chip{display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:500; border:1px solid var(--border-strong); border-radius:9px; padding:7px 10px; cursor:pointer; background:var(--surface);}
  .check-chip input{accent-color:var(--brand-ink);}
  .modal-error{background:rgba(208,59,59,0.1); color:var(--status-critical); border:1px solid rgba(208,59,59,0.25); border-radius:9px; padding:8px 11px; font-size:12.5px; font-weight:600;}

  .switch{position:relative; width:38px; height:22px; flex:none; display:inline-block;}
  .switch input{opacity:0; width:100%; height:100%; margin:0; position:absolute; cursor:pointer;}
  .switch .track{position:absolute; inset:0; background:var(--border-strong); border-radius:999px; transition:background .15s;}
  .switch .thumb{position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#fff; box-shadow:var(--shadow-sm); transition:transform .15s;}
  .switch input:checked + .track{background:var(--brand-ink);}
  .switch input:checked ~ .thumb{transform:translateX(16px);}
  .switch input:focus-visible + .track{outline:2px solid var(--brand-accent); outline-offset:2px;}
  .switch input:disabled{cursor:not-allowed;}
  .switch input:disabled + .track{opacity:.5;}

  .settings-row{display:flex; align-items:flex-start; justify-content:space-between; gap:20px; padding:14px 0; border-bottom:1px solid var(--border);}
  .settings-row:last-child{border-bottom:none;}
  .settings-row-text b{display:block; font-size:13.5px; margin-bottom:2px;}
  .settings-row-text span{font-size:12px; color:var(--ink-faint);}

  .file-btn{position:relative; overflow:hidden;}
  .file-btn input[type="file"]{position:absolute; inset:0; opacity:0; cursor:pointer; width:100%;}

  /* ---------- modal ---------- */
  #modal-root:empty{display:none;}
  .modal-overlay{position:fixed; inset:0; background:rgba(10,12,18,0.5); display:flex; align-items:center; justify-content:center; padding:24px; z-index:50;}
  .modal{background:var(--surface); border-radius:var(--r-xl); width:100%; max-width:460px; box-shadow:var(--shadow-md); max-height:88vh; overflow-y:auto;}
  .modal-head{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; padding:20px 22px 4px;}
  .modal-body{padding:14px 22px 22px; display:flex; flex-direction:column; gap:14px;}
  .modal-foot{display:flex; justify-content:flex-end; gap:10px; padding:4px 22px 22px;}
  .modal-close{background:none; border:none; cursor:pointer; color:var(--ink-faint); padding:4px;}

  /* ---------- login ---------- */
  #login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--brand-ink); padding:24px;}
  .login-card{width:100%; max-width:380px; background:var(--surface); border-radius:var(--r-xl); box-shadow:var(--shadow-md); padding:34px 30px 28px;}
  .login-logo{display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:22px;}
  .login-logo svg{width:52px; height:52px;}
  .login-logo b{font-family:var(--font-display); font-weight:800; font-size:21px;}
  .login-logo span{font-size:11.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.08em;}
  #login-form{display:flex; flex-direction:column; gap:13px;}
  #login-form label.field{gap:6px;}
  #login-form input{padding:10px 12px; font-size:13.5px;}
  .login-foot{margin-top:18px; text-align:center; font-size:11.5px; color:var(--ink-faint); line-height:1.5;}

  /* ---------- dialer ---------- */
  .dial-panel{display:flex; flex-direction:column; align-items:center; gap:16px; padding:26px 20px;}
  .dial-ring{width:180px; height:180px; border-radius:50%; display:flex; align-items:center; justify-content:center; position:relative; border:3px solid var(--border-strong); background:var(--surface-2);}
  .dial-ring.dialing{border-color:var(--cat-4); animation:pulse 1s ease-in-out infinite;}
  .dial-ring.ringing{border-color:var(--cat-1); animation:pulse .6s ease-in-out infinite;}
  .dial-ring.active{border-color:var(--status-good); background:rgba(12,163,12,0.06);}
  .dial-ring.wrapup{border-color:var(--brand-accent);}
  @keyframes pulse{0%,100%{transform:scale(1);} 50%{transform:scale(1.035);}}
  .dial-center{display:flex; flex-direction:column; align-items:center; gap:4px;}
  .dial-timer{font-family:var(--font-mono); font-size:27px; font-weight:600; letter-spacing:.01em;}
  .dial-status-text{font-size:12.5px; color:var(--ink-muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em;}
  .dial-contact{text-align:center;}
  .dial-contact b{font-size:14.5px;}
  .dial-contact div{font-family:var(--font-mono); font-size:12px; color:var(--ink-muted); margin-top:2px;}
  .dial-actions{display:flex; gap:10px; align-items:center;}
  .rec-indicator{display:flex; align-items:center; gap:6px; font-size:11.5px; font-weight:600; color:var(--status-critical);}
  .rec-dot{width:8px; height:8px; border-radius:50%; background:var(--status-critical); animation:blink 1.1s ease-in-out infinite;}
  @keyframes blink{0%,100%{opacity:1;} 50%{opacity:.25;}}

  .manual-dial{width:100%; border-top:1px solid var(--border); margin-top:4px; padding-top:16px; display:flex; flex-direction:column; gap:8px;}
  .manual-dial-label{font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); font-weight:600;}
  .manual-dial-row{display:flex; gap:8px; flex-wrap:wrap;}
  .manual-dial-row input{flex:1; min-width:120px;}

  .queue-list{display:flex; flex-direction:column; gap:0;}
  .queue-item{display:flex; align-items:center; justify-content:space-between; padding:10px 4px; border-bottom:1px solid var(--border); gap:10px;}
  .queue-item:last-child{border-bottom:none;}
  .queue-item .qi-name{font-size:13px; font-weight:600;}
  .queue-item .qi-phone{font-family:var(--font-mono); font-size:11.5px; color:var(--ink-faint);}
  .queue-pos{width:22px; height:22px; border-radius:50%; background:var(--surface-2); color:var(--ink-faint); font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; flex:none;}

  /* ---------- charts ---------- */
  .chart-legend{display:flex; flex-wrap:wrap; gap:12px; margin-top:10px;}
  .legend-item{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-muted);}
  .legend-swatch{width:9px; height:9px; border-radius:2.5px; flex:none;}
  .donut-wrap{display:flex; align-items:center; gap:20px; flex-wrap:wrap;}
  .donut{width:128px; height:128px; border-radius:50%; flex:none;}
  .donut-hole{width:78px; height:78px; border-radius:50%; background:var(--surface); margin:25px; display:flex; align-items:center; justify-content:center; flex-direction:column;}
  .donut-hole b{font-family:var(--font-mono); font-size:18px;}
  .donut-hole span{font-size:10px; color:var(--ink-faint);}

  .progress-track{height:6px; border-radius:999px; background:var(--surface-2); overflow:hidden;}
  .progress-fill{height:100%; background:var(--cat-1); border-radius:999px;}

  /* ---------- agent grid ---------- */
  .agent-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
  .agent-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); padding:16px; display:flex; flex-direction:column; gap:10px; box-shadow:var(--shadow-sm);}
  .agent-top{display:flex; align-items:center; gap:10px;}
  .agent-avatar{width:36px; height:36px; border-radius:50%; background:var(--brand-ink-soft); color:var(--brand-ink); display:flex; align-items:center; justify-content:center; font-weight:700; font-family:var(--font-display); font-size:12.5px; flex:none;}
  .agent-name{font-weight:700; font-size:13.5px;}
  .agent-camp{font-size:11.5px; color:var(--ink-faint);}
  .agent-stats{display:flex; gap:16px;}
  .agent-stats div{display:flex; flex-direction:column;}
  .agent-stats b{font-family:var(--font-mono); font-size:15px;}
  .agent-stats span{font-size:10.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.04em;}

  @media (max-width:980px){
    #shell{grid-template-columns:74px 1fr;}
    .brand-word,.brand-sub,.nav-item span.nav-label,.nav-group-label,.sidebar-foot{display:none;}
    .nav-item{justify-content:center;}
    .kpi-grid{grid-template-columns:repeat(2,1fr);}
    .grid-2,.grid-2-rev{grid-template-columns:1fr;}
    .agent-grid{grid-template-columns:repeat(2,1fr);}
  }
</style>

<div id="app"></div>
<div id="modal-root"></div>

<script>

  /* ============================= PERSISTENCE ============================= */
  function persist(){
    try{
      const snapshot = { admins, agents, campaigns, numbers, contactBase, queues, callLog, settings, permissions, session: state.session, uidCounter };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(snapshot));
    }catch(e){ /* storage unavailable — demo continues in memory for this visit */ }
  }
  function loadPersisted(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return null;
      const s = JSON.parse(raw);
      if(!s || typeof s!=='object') return null;
      if(Array.isArray(s.admins) && s.admins.length) admins = s.admins;
      if(Array.isArray(s.agents) && s.agents.length) agents = s.agents;
      if(Array.isArray(s.campaigns)) campaigns = s.campaigns;
      if(Array.isArray(s.numbers)) numbers = s.numbers;
      if(Array.isArray(s.contactBase)) contactBase = s.contactBase;
      if(s.queues && typeof s.queues==='object') queues = s.queues;
      if(Array.isArray(s.callLog)) callLog = s.callLog;
      if(s.settings) Object.assign(settings, s.settings);
      if(s.permissions) Object.assign(permissions, s.permissions);
      if(typeof s.uidCounter==='number') uidCounter = s.uidCounter;
      return s.session || null;
    }catch(e){ return null; }
  }

  /* ============================= CHART HELPERS ============================= */
  function svgLine(data, {color='var(--cat-1)', h=140}={}){
    const w = 560, padL=30, padR=14, padT=14, padB=24;
    const max = Math.max(...data.map(d=>d.value)) * 1.15 || 1;
    const stepX = (w-padL-padR)/(data.length-1);
    const y = v => padT + (h-padT-padB) * (1 - v/max);
    const pts = data.map((d,i)=>[padL+i*stepX, y(d.value)]);
    const line = pts.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
    const area = line + ` L${pts[pts.length-1][0].toFixed(1)},${(h-padB).toFixed(1)} L${pts[0][0].toFixed(1)},${(h-padB).toFixed(1)} Z`;
    const grid = [0,0.5,1].map(f=>{
      const gy = padT + (h-padT-padB)*f;
      return `<line x1="${padL}" x2="${w-padR}" y1="${gy.toFixed(1)}" y2="${gy.toFixed(1)}" stroke="var(--chart-grid)" stroke-width="1"/>`;
    }).join('');
    const dots = pts.map((p,i)=> `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i===pts.length-1?4:2.6}" fill="${color}"><title>${esc(data[i].label)} — ${data[i].value} llamadas</title></circle>`).join('');
    const labels = data.map((d,i)=> i%2===0 || data.length<7 ? `<text x="${pts[i][0].toFixed(1)}" y="${h-6}" font-size="9.5" fill="var(--ink-faint)" text-anchor="middle" font-family="var(--font-mono)">${esc(d.label)}</text>` : '').join('');
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="Gráfica de llamadas por hora">
      ${grid}
      <path d="${area}" fill="${color}" fill-opacity="0.12" stroke="none"/>
      <path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      ${dots}${labels}
    </svg>`;
  }

  function svgBarH(data, {h=26, gap=12}={}){
    const w=520, padL=150, padR=44, rowH=h+gap;
    const max = Math.max(...data.map(d=>d.value)) * 1.12 || 1;
    const totalH = data.length*rowH + 6;
    const bars = data.map((d,i)=>{
      const y = i*rowH+4;
      const bw = (w-padL-padR) * (d.value/max);
      return `<text x="${padL-10}" y="${y+h/2+4}" text-anchor="end" font-size="12" fill="var(--ink)" font-weight="600">${esc(d.label)}</text>
        <rect x="${padL}" y="${y}" width="${Math.max(bw,3).toFixed(1)}" height="${h}" rx="5" fill="${d.color}"><title>${esc(d.label)}: ${d.value}</title></rect>
        <text x="${(padL+bw+8).toFixed(1)}" y="${y+h/2+4}" font-size="11.5" fill="var(--ink-muted)" font-family="var(--font-mono)">${d.value}</text>`;
    }).join('');
    return `<svg viewBox="0 0 ${w} ${totalH}" width="100%" height="${totalH}" role="img">${bars}</svg>`;
  }

  function svgBarV(data, {h=150}={}){
    const w=560, padL=34, padR=10, padT=10, padB=26, gap=14;
    const bw = (w-padL-padR)/data.length - gap;
    const max = Math.max(...data.map(d=>d.value)) * 1.15 || 1;
    const grid = [0,0.5,1].map(f=>{
      const gy = padT + (h-padT-padB)*f;
      return `<line x1="${padL}" x2="${w-padR}" y1="${gy.toFixed(1)}" y2="${gy.toFixed(1)}" stroke="var(--chart-grid)" stroke-width="1"/>`;
    }).join('');
    const bars = data.map((d,i)=>{
      const x = padL + i*((w-padL-padR)/data.length) + gap/2;
      const bh = (h-padT-padB) * (d.value/max);
      const y = h-padB-bh;
      return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="4" fill="var(--cat-1)"><title>${esc(d.label)}: ${d.value}</title></rect>
        <text x="${(x+bw/2).toFixed(1)}" y="${h-8}" font-size="10.5" fill="var(--ink-faint)" text-anchor="middle" font-family="var(--font-mono)">${esc(d.label)}</text>`;
    }).join('');
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img">${grid}${bars}</svg>`;
  }

  function svgStacked(data, {h=170}={}){
    const w=560, padL=30, padR=10, padT=10, padB=26, gap=16;
    const bw = (w-padL-padR)/data.length - gap;
    const max = Math.max(...data.map(d=>d.a+d.b)) * 1.15 || 1;
    const grid = [0,0.5,1].map(f=>{
      const gy = padT + (h-padT-padB)*f;
      return `<line x1="${padL}" x2="${w-padR}" y1="${gy.toFixed(1)}" y2="${gy.toFixed(1)}" stroke="var(--chart-grid)" stroke-width="1"/>`;
    }).join('');
    const bars = data.map((d,i)=>{
      const x = padL + i*((w-padL-padR)/data.length) + gap/2;
      const hb = (h-padT-padB) * (d.b/max);
      const ha = (h-padT-padB) * (d.a/max);
      const yB = h-padB-hb;
      const yA = yB-ha-2;
      return `<rect x="${x.toFixed(1)}" y="${yB.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(hb-1,0).toFixed(1)}" rx="3" fill="var(--cat-2)"><title>${esc(d.label)} · Saliente: ${d.b}</title></rect>
        <rect x="${x.toFixed(1)}" y="${yA.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(ha-1,0).toFixed(1)}" rx="3" fill="var(--cat-1)"><title>${esc(d.label)} · Entrante: ${d.a}</title></rect>
        <text x="${(x+bw/2).toFixed(1)}" y="${h-8}" font-size="10.5" fill="var(--ink-faint)" text-anchor="middle" font-family="var(--font-mono)">${esc(d.label)}</text>`;
    }).join('');
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img">${grid}${bars}</svg>`;
  }

  function donut(data, size=128){
    const total = data.reduce((s,d)=>s+d.value,0) || 1;
    let acc = 0;
    const stops = data.map(d=>{
      const start = acc/total*360; acc += d.value; const end = acc/total*360;
      return `${d.color} ${start.toFixed(1)}deg ${end.toFixed(1)}deg`;
    }).join(', ');
    const legend = data.map(d=> `<div class="legend-item"><span class="legend-swatch" style="background:${d.color}"></span>${esc(d.label)} · ${Math.round(d.value/total*100)}%</div>`).join('');
    return `<div class="donut-wrap">

  function renderLogin(){
    document.getElementById('app').innerHTML = `
      <div id="login-wrap">
        <div class="login-card">
          <div class="login-logo">
            ${brandMarkSVG(52)}
            <b>Davvinci</b>
            <span>Centro de llamadas</span>
          </div>
          <form id="login-form">
            ${state.loginError ? `<div class="modal-error">${esc(state.loginError)}</div>` : ''}

  function onLoginSubmit(e){
    e.preventDefault();
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;
    const found = findUserByEmail(email);
    if(!found || found.user.password !== password || found.user.active===false){
      state.loginError = 'Correo o contraseña incorrectos.';
      renderLogin();
      return;
    }
    state.session = {userId: found.user.id, role: found.kind};
    state.role = found.kind;
    if(found.kind==='agente') state.currentAgentId = found.user.id;
    state.view = 'dashboard';
    state.loginError = '';
    renderAll();
  }

  /* ============================= VIEW: DASHBOARD ============================= */
  function viewDashboardAdmin(){
    const totalCalls = callLog.length;
    const sales = callLog.filter(l=>l.dispo==='venta').length;
    const contactRate = Math.round(callLog.filter(l=>!['no_contesto','buzon','no_disponible'].includes(l.dispo)).length / totalCalls * 100) || 0;
    const availableAgents = agents.filter(a=>a.status==='Disponible').length;
    const byHour = [{label:'09:00',value:6},{label:'10:00',value:11},{label:'11:00',value:16},{label:'12:00',value:14},{label:'13:00',value:9},{label:'14:00',value:7},{label:'15:00',value:13},{label:'16:00',value:18},{label:'17:00',value:15}];
    const byCampaign = campaigns.filter(c=>c.status==='Activa').map((c,i)=>({label:c.name.split(' ').slice(0,3).join(' '), value:c.contacted, color:['var(--cat-1)','var(--cat-2)','var(--cat-3)','var(--cat-4)'][i%4]}));
    const dispoCounts = {};
    callLog.forEach(l=> dispoCounts[l.dispo] = (dispoCounts[l.dispo]||0)+1);
    const dispoData = Object.entries(dispoCounts).map(([id,value])=>({label:DISPO_MAP[id].label, value, color:`var(--status-${DISPO_MAP[id].tone==='warn'?'warning':DISPO_MAP[id].tone})`}));

    return `
      <div class="kpi-grid">
        <div class="kpi"><span class="kpi-label">Llamadas hoy</span><span class="kpi-value">${totalCalls*23}</span><span class="kpi-delta good">▲ 8% vs. ayer</span></div>
        <div class="kpi"><span class="kpi-label">Tasa de contacto</span><span class="kpi-value">${contactRate}%</span><span class="kpi-delta good">▲ 3 pts</span></div>
        <div class="kpi"><span class="kpi-label">Ventas del día</span><span class="kpi-value">${sales*7}</span><span class="kpi-delta good">▲ 12%</span></div>
        <div class="kpi"><span class="kpi-label">Agentes disponibles</span><span class="kpi-value">${availableAgents}/${agents.length}</span><span class="kpi-delta warn">2 en pausa</span></div>
      </div>
      <div class="grid-2">
        <div class="card card-pad">
          <div class="card-head"><span class="card-title">Llamadas por hora</span><span class="card-note">Hoy · datos de ejemplo</span></div>
          ${svgLine(byHour,{color:'var(--cat-1)'})}
        </div>
        <div class="card card-pad">
          <div class="card-head"><span class="card-title">Resultado de llamadas</span></div>
          ${donut(dispoData,120)}
        </div>
      </div>
      <div class="grid-2">
        <div class="card card-pad">
          <div class="card-head"><span class="card-title">Contactos por campaña</span><span class="card-note">Campañas activas</span></div>
          ${svgBarH(byCampaign)}
        </div>
        <div class="card card-pad">
          <div class="card-head"><span class="card-title">Actividad reciente</span></div>
          ${renderCallLogMini(callLog.slice(0,4))}
        </div>
      </div>
    `;
  }

  function viewDashboardAgente(){
    const agent = agentById(state.currentAgentId);
    if(!agent) return `<div class="empty-note">No se encontró el agente.</div>`;
    const myCalls = callLog.filter(l=>l.agentId===agent.id);
    const campaign = campaignById(agent.campaignId);
    const myPending = contactBase.filter(c=>c.campaignId===agent.campaignId && c.status==='Pendiente').length;
    return `
      <div class="kpi-grid">
        <div class="kpi"><span class="kpi-label">Mis llamadas hoy</span><span class="kpi-value">${agent.callsToday}</span></div>
        <div class="kpi"><span class="kpi-label">Mi TMO</span><span class="kpi-value">${agent.aht}</span></div>
        <div class="kpi"><span class="kpi-label">Mi estado</span><span class="kpi-value" style="font-size:16px; margin-top:6px;">${statusBadge(agent.status)}</span></div>
        <div class="kpi"><span class="kpi-label">Ventas hoy</span><span class="kpi-value">${myCalls.filter(l=>l.dispo==='venta').length*3}</span></div>
      </div>
      <div class="grid-2-rev">
        <div class="card card-pad" style="display:flex; flex-direction:column; gap:12px;">
          <div class="card-head"><span class="card-title">Mi campaña asignada</span></div>
          ${campaign ? `
            <div>
              <b style="font-size:14px;">${esc(campaign.name)}</b>
              <div class="card-note" style="margin:4px 0 10px;">${campaign.type} · Marcador ${campaign.dmode} · ${myPending} contactos en la base de clientes</div>
              <div class="progress-track"><div class="progress-fill" style="width:${Math.round(campaign.contacted/Math.max(campaign.total,1)*100)}%"></div></div>
              <div class="card-note" style="margin-top:6px;">${campaign.contacted}/${campaign.total || '—'} contactos trabajados</div>

  function renderCallLogMini(rows){
    if(!rows.length) return `<div class="empty-note">Aún no hay llamadas registradas.</div>`;
    return `<div style="display:flex; flex-direction:column;">${rows.map(l=>`
      <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid var(--border);">
        <div style="display:flex; align-items:center; gap:9px; min-width:0;">
          <span style="color:var(--ink-faint);">${l.direction==='Entrante'?ICONS.phoneIn:ICONS.phoneOut}</span>
          <div style="min-width:0;">
            <div style="font-weight:600; font-size:12.8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${esc(l.contact)}</div>
            <div class="card-note num">${l.time} · ${l.duration}</div>
          </div>
        </div>
        ${dispoBadge(l.dispo)}
      </div>`).join('')}</div>`;
  }

  /* ============================= VIEW: MARCADOR ============================= */
  function viewMarcador(){
    const d = state.dialer;
    const myCampaigns = state.role==='agente' ? campaigns.filter(c=>c.agentIds.includes(state.currentAgentId)) : campaigns.filter(c=>c.status==='Activa');
    if(!myCampaigns.find(c=>c.id===d.campaignId) && myCampaigns[0]) d.campaignId = myCampaigns[0].id;
    const campaign = campaignById(d.campaignId);
    const isInbound = campaign && campaign.type==='Entrante';
    const queue = queues[d.campaignId] || [];

    const ringClass = d.status;
    let center = '';
    if(d.status==='idle'){
      center = `<div class="dial-center">${ICON_DIAL_BIG}<span class="dial-status-text" style="margin-top:8px;">Listo</span></div>`;
    } else if(d.status==='dialing'){
      center = `<div class="dial-center"><span class="dial-status-text">Marcando…</span><div class="dial-contact"><b>${esc(d.contact.name)}</b><div class="num">${d.contact.phone}</div></div></div>`;
    } else if(d.status==='ringing'){
      center = `<div class="dial-center"><span class="dial-status-text">Timbrando…</span><div class="dial-contact"><b>${esc(d.contact.name)}</b><div class="num">${d.contact.phone}</div></div></div>`;
    } else if(d.status==='active'){
      center = `<div class="dial-center"><span class="dial-timer num">${fmtMMSS(d.elapsed)}</span><div class="dial-contact"><b>${esc(d.contact.name)}</b><div class="num">${d.contact.phone}</div></div></div>`;
    } else if(d.status==='wrapup'){
      center = `<div class="dial-center"><span class="dial-status-text">Llamada finalizada</span><span class="num" style="font-size:20px; margin-top:4px;">${fmtMMSS(d.elapsed)}</span></div>`;
    }

    const primaryBtn = (()=>{
      if(d.status==='idle'){
        if(isInbound) return `<button class="btn btn-primary" data-action="dial-inbound">${ICONS.phoneIn} Simular llamada entrante</button>`;
        if(!queue.length) return `<button class="btn" disabled>Sin contactos en cola</button>`;
        return `<button class="btn btn-primary" data-action="dial-next">${ICONS.phoneOut} Llamar siguiente contacto</button>`;
      }
      if(d.status==='active'){
        return `<button class="btn btn-danger" data-action="end-call">${ICONS.end} Finalizar llamada</button>`;
      }
      if(d.status==='wrapup'){
        return `<button class="btn btn-accent" data-action="open-dispo">Registrar tipificación</button>`;
      }
      return `<button class="btn" disabled>${d.status==='dialing'?'Marcando…':'Timbrando…'}</button>`;
    })();

    const muteBtn = d.status==='active' ? `<button class="btn btn-ghost btn-sm" data-action="toggle-mute">${d.muted?ICONS.micOff:ICONS.mic} ${d.muted?'Reactivar mic':'Silenciar'}</button>` : '';
    const recBadge = d.status==='active' ? (settings.recordingEnabled ? `<div class="rec-indicator"><span class="rec-dot"></span>Grabando llamada</div>` : `<div class="rec-indicator" style="color:var(--ink-faint);">Grabación desactivada</div>`) : '';

    const realCallBadge = settings.realCallMode && d.realStatus ? (()=>{
      const tone = d.realStatus==='error' ? 'var(--status-critical)' : d.realStatus==='ok' ? 'var(--status-good-text)' : 'var(--ink-muted)';
      const icon = d.realStatus==='error' ? '⚠' : '☎';
      return `<div class="card-note" style="margin-top:8px; color:${tone}; font-weight:600;">${icon} ${esc(d.realMsg)}</div>`;
    })() : '';

    const campaignPicker = myCampaigns.length>1 && d.status==='idle' ? `
      <label class="field" style="width:100%; max-width:280px;">Campaña
        <select data-change="dial-campaign">
          ${myCampaigns.map(c=>`<option value="${c.id}" ${c.id===d.campaignId?'selected':''}>${esc(c.name)}</option>`).join('')}
        </select>
      </label>` : `<div class="card-note">${campaign?esc(campaign.name):'Sin campaña'} ${campaign?`· ${campaign.type}`:''}</div>`;

    const manualDial = d.status==='idle' ? `
      <div class="manual-dial">
        <div class="manual-dial-label">O marca un número nuevo</div>
        <div class="manual-dial-row">
          <input type="text" id="manual-name" placeholder="Nombre (opcional)">
          <input type="tel" id="manual-phone" placeholder="+52 55 0000 0000">
          <button class="btn btn-accent" data-action="dial-manual">${ICONS.phoneOut} Llamar</button>
        </div>
      </div>` : '';

    return `
      <div class="grid-2">
        <div class="card">
          <div class="card-pad dial-panel">
            ${settings.realCallMode ? `<div class="badge good" style="align-self:flex-start; margin-bottom:4px;"><span class="badge-dot"></span>Llamadas reales activadas</div>` : ''}
            ${campaignPicker}
            <div class="dial-ring ${ringClass}">${center}</div>
            <div class="dial-actions">${primaryBtn}${muteBtn}</div>
            ${recBadge}
            ${realCallBadge}
            ${manualDial}
          </div>
        </div>
        <div style="display:flex; flex-direction:column; gap:16px;">
          <div class="card card-pad">
            <div class="card-head"><span class="card-title">${isInbound?'Últimas llamadas recibidas':'Cola de contactos'}</span><span class="card-note">${isInbound?'':queue.length+' pendientes'}</span></div>
            ${isInbound ? `<div class="empty-note" style="padding:8px 0 0;">Los contactos entrantes llegan según marcan al número asignado.</div>` :
              (queue.length ? `<div class="queue-list">${queue.slice(0,6).map((q,i)=>`
                <div class="queue-item"><div style="display:flex; align-items:center; gap:10px;"><span class="queue-pos">${i+1}</span><div><div class="qi-name">${esc(q.name)}</div><div class="qi-phone">${q.phone}</div></div></div></div>`).join('')}</div>`
              : `<div class="empty-note">No quedan contactos en la cola de esta campaña. Ve a <b>Base de clientes</b> para cargar más, o marca un número nuevo aquí a la izquierda.</div>`)}
          </div>
          <div class="card card-pad">
            <div class="card-head"><span class="card-title">Historial reciente</span></div>
            ${renderCallLogMini(callLog.slice(0,4))}
          </div>
        </div>
      </div>
    `;
  }

  /* ============================= VIEW: BASE DE CLIENTES ============================= */
  function viewBase(){
    const canManage = can('manageContacts');
    const f = state.baseFilter;
    let rows = contactBase.slice();
    if(f.campaignId) rows = rows.filter(c=>c.campaignId===f.campaignId);
    if(f.q) { const q=f.q.toLowerCase(); rows = rows.filter(c=> c.name.toLowerCase().includes(q) || c.phone.includes(q)); }

    const tableRows = rows.map(c=>`
      <tr>
        <td><b>${esc(c.name)}</b></td>
        <td class="num">${esc(c.phone)}</td>
        <td>
          ${canManage ? `<select data-change="contact-campaign" data-id="${c.id}" style="min-width:170px;">
              <option value="">Sin asignar</option>
              ${campaigns.map(cp=>`<option value="${cp.id}" ${c.campaignId===cp.id?'selected':''}>${esc(cp.name)}</option>`).join('')}
            </select>`
            : (campaignById(c.campaignId) ? esc(campaignById(c.campaignId).name) : '<span class="card-note">Sin asignar</span>')}
        </td>
        <td>${c.status==='Contactado' ? `<span class="badge good"><span class="badge-dot"></span>Contactado</span>` : `<span class="badge neutral"><span class="badge-dot"></span>Pendiente</span>`}</td>
        <td><button class="btn btn-sm btn-primary" data-action="call-base" data-id="${c.id}">${ICONS.phoneOut} Llamar</button></td>
      </tr>`).join('');

    return `
      <div class="toolbar">
        <div class="toolbar-title"><span class="card-title">Base de clientes</span><span class="card-note">${contactBase.length} contactos cargados en total</span></div>
        ${canManage ? `
        <div class="toolbar-actions">
          <button class="btn file-btn"><input type="file" id="csv-input" accept=".csv,text/csv" data-change="csv-upload">${ICONS.upload} Subir CSV</button>
          <button class="btn btn-primary" data-action="open-new-contact">${ICONS.plus} Agregar contacto</button>
        </div>` : ''}
      </div>
      <div class="filter-row">
        <input type="search" id="base-search" placeholder="Buscar por nombre o teléfono…" data-change="base-search" value="${esc(f.q)}" style="min-width:220px;">
        <select data-change="base-campaign-filter">
          <option value="">Todas las campañas</option>
          ${campaigns.map(cp=>`<option value="${cp.id}" ${f.campaignId===cp.id?'selected':''}>${esc(cp.name)}</option>`).join('')}
        </select>
      </div>
      ${rows.length ? `<div class="table-wrap"><table class="data">
        <thead><tr><th>Nombre</th><th>Teléfono</th><th>Campaña</th><th>Estado</th><th></th></tr></thead>
        <tbody>${tableRows}</tbody>
      </table></div>` : `<div class="card"><div class="empty-note">No hay contactos que coincidan con el filtro.</div></div>`}
      <div class="card-note">Formato del CSV: dos columnas, <code>nombre,telefono</code> (con o sin encabezado).</div>
    `;
  }

  /* ============================= VIEW: CAMPAÑAS ============================= */
  function viewCampañas(){
    const canCreate = can('createCampaigns');
    const rows = campaigns.map(c=>{
      const pct = c.total ? Math.round(c.contacted/c.total*100) : (c.status==='Activa' ? null : 100);
      return `<tr>
        <td><b>${esc(c.name)}</b><div class="card-note">${c.numberIds.map(id=>numberById(id)?.number).filter(Boolean).join(', ')}</div></td>
        <td>${c.type}</td>
        <td>${c.dmode}</td>
        <td>${c.agentIds.map(id=>agentById(id)?.name.split(' ')[0]).filter(Boolean).join(', ') || '—'}</td>
        <td style="min-width:140px;">
          ${pct===null ? `<span class="card-note">${c.contacted} recibidas hoy</span>` : `
          <div class="progress-track"><div class="progress-fill" style="width:${pct}%; background:${c.status==='Pausada'?'var(--ink-faint)':'var(--cat-1)'}"></div></div>
          <div class="card-note" style="margin-top:4px;">${c.contacted}/${c.total} · ${pct}%</div>`}
        </td>
        <td>${c.status==='Activa'?`<span class="badge good"><span class="badge-dot"></span>Activa</span>`:`<span class="badge neutral"><span class="badge-dot"></span>Pausada</span>`}</td>
      </tr>`;
    }).join('');

    return `
      <div class="toolbar">
        <div class="toolbar-title"><span class="card-title">Todas las campañas</span><span class="card-note">Entrantes, salientes y mixtas</span></div>
        ${canCreate ? `<button class="btn btn-primary" data-action="open-new-campaign">${ICONS.plus} Nueva campaña</button>` : `<span class="card-note">Solo lectura para tu rol</span>`}
      </div>
      <div class="table-wrap"><table class="data">
        <thead><tr><th>Campaña</th><th>Tipo</th><th>Marcador</th><th>Agentes</th><th>Progreso</th><th>Estado</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    `;
  }

  /* ============================= DIALER LOGIC ============================= */
  function startCall(contact, contactBaseId){
    const d = state.dialer;
    d.status='dialing'; d.contact=contact; d.elapsed=0; d.muted=false; d.contactBaseId = contactBaseId || null;
    d.realStatus=null; d.realMsg='';
    renderAll();
    setTimeout(()=>{ if(state.dialer.status!=='dialing') return; d.status='ringing'; renderAll(); }, 750);
    setTimeout(()=>{ if(state.dialer.status!=='ringing') return;
      d.status='active'; renderAll();
      d.timerHandle = setInterval(()=>{ d.elapsed++; const t=document.querySelector('.dial-timer'); if(t) t.textContent=fmtMMSS(d.elapsed); else renderAll(); }, 1000);
    }, 1650);
    if(settings.realCallMode) triggerRealCall(contact);
  }

  // Marca de verdad usando el backend de Telnyx (ver Configuración > Llamadas reales).
  // Le marca primero al teléfono del agente; en cuanto contesta, el backend
  // conecta automáticamente al contacto. Esto corre en paralelo a la
  // simulación visual de arriba — el audio real va por la llamada telefónica,
  // no por el navegador.
  async function triggerRealCall(contact){
    const d = state.dialer;
    const agent = state.role==='agente' ? agentById(state.currentAgentId) : agentById(state.currentAgentId) || agents[0];
    const agentPhone = agent && agent.phone;
    if(!settings.backendUrl){ d.realStatus='error'; d.realMsg='Falta configurar la URL del backend en Configuración.'; renderView(); return; }
    if(!agentPhone){ d.realStatus='error'; d.realMsg=`${agent?esc(agent.name):'Este agente'} no tiene un teléfono real registrado (Configuración › Agentes).`; renderView(); return; }
    d.realStatus='sending'; d.realMsg=`Marcando tu teléfono (${agentPhone})…`; renderView();
    try{
      const resp = await fetch(settings.backendUrl.replace(/\/$/,'') + '/api/dial', {
        method:'POST',
        headers:{ 'Content-Type':'application/json', 'x-app-key': settings.appSecret || '' },
        body: JSON.stringify({ agentPhone, contactPhone: contact.phone, contactName: contact.name }),
      });
      const data = await resp.json().catch(()=>({}));
      if(!resp.ok || !data.ok){
        d.realStatus='error'; d.realMsg = data.error || `El backend respondió ${resp.status}.`;
      } else {
        d.realStatus='ok'; d.realMsg = data.message || 'Llamada real iniciada — contesta tu teléfono.';
      }
    }catch(err){
      d.realStatus='error'; d.realMsg = 'No se pudo contactar al backend (revisa que esté encendido y la URL sea correcta).';
    }
    renderView();
  }

  function endCall(){
    const d = state.dialer;
    if(d.timerHandle) clearInterval(d.timerHandle);
    d.status='wrapup';
    renderAll();
  }

  function finalizeDisposition(dispoId, notes){
    const d = state.dialer;
    const camp = campaignById(d.campaignId);
    const agentId = state.role==='agente' ? state.currentAgentId : (camp && camp.agentIds[0]) || (agents[0] && agents[0].id);
    const now = new Date();
    const timeLabel = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
    callLog.unshift({
      id:uid('l'), time:timeLabel, agentId, campaignId: camp?camp.id:null, contact:d.contact.name, phone:d.contact.phone,
      direction: (camp && camp.type==='Entrante') ? 'Entrante' : 'Saliente', duration:fmtMMSS(d.elapsed), dispo:dispoId, recorded: settings.recordingEnabled,
    });
    if(camp){
      if(camp.type!=='Entrante'){ camp.contacted = Math.min(camp.contacted+1, camp.total||camp.contacted+1); }
      else { camp.contacted += 1; }
    }
    const ag = agentById(agentId); if(ag) ag.callsToday += 1;
    if(d.contactBaseId){
      const bc = contactBase.find(c=>c.id===d.contactBaseId);
      if(bc) bc.status = 'Contactado';
    }
    d.status='idle'; d.contact=null; d.elapsed=0; d.contactBaseId=null;
    state.modal=null;
    renderAll();
  }

  function parseCSV(text){
    const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
    if(!lines.length) return [];
    let rows = lines.map(l=>l.split(',').map(c=>c.trim().replace(/^"|"$/g,'')));
    const header = rows[0].map(h=>h.toLowerCase());
    const looksHeader = header.some(h=>h.includes('nombre')||h.includes('name')||h.includes('telefono')||h.includes('teléfono')||h.includes('phone')||h.includes('tel'));
    let nameIdx=0, phoneIdx=1;
    if(looksHeader){
      const ni = header.findIndex(h=>h.includes('nombre')||h.includes('name'));
      const pi = header.findIndex(h=>h.includes('telefono')||h.includes('teléfono')||h.includes('phone')||h.includes('tel'));
      if(ni>=0) nameIdx=ni; if(pi>=0) phoneIdx=pi;
      rows = rows.slice(1);
    }
    return rows.filter(r=>r.length>Math.max(nameIdx,phoneIdx) && r[phoneIdx]).map(r=>({name:r[nameIdx]||'Sin nombre', phone:r[phoneIdx]}));
  }

  /* ============================= EVENT DELEGATION ============================= */
  document.addEventListener('click', (e)=>{
    const el = e.target.closest('[data-action]');
    if(!el) return;
    const action = el.dataset.action;

    if(action==='nav'){ state.view = el.dataset.view; renderAll(); }
    else if(action==='logout'){
      const d = state.dialer;
      if(d.timerHandle) clearInterval(d.timerHandle);
      state.session=null; state.dialer={status:'idle', campaignId:(campaigns[0]&&campaigns[0].id)||null, contact:null, elapsed:0, muted:false, timerHandle:null, contactBaseId:null, realStatus:null, realMsg:''};
      state.view='dashboard'; state.loginError='';
      renderAll();
    }
    else if(action==='role'){
      state.role = el.dataset.role;
      const item = NAV.find(n=>n.id===state.view);
      const stillValid = item && (item.perm===null || can(item.perm));
      if(!stillValid) state.view='dashboard';
      renderAll();
    }
    else if(action==='dial-next'){
      const q = queues[state.dialer.campaignId];
      if(q && q.length){ const contact = q.shift(); startCall(contact); }
    }
    else if(action==='dial-inbound'){
      const contact = INBOUND_CALLERS[Math.floor(Math.random()*INBOUND_CALLERS.length)];
      startCall(contact);
    }
    else if(action==='dial-manual'){
      const nameEl = document.getElementById('manual-name');
      const phoneEl = document.getElementById('manual-phone');
      const phone = phoneEl.value.trim();
      if(!phone){ phoneEl.focus(); return; }
      startCall({name: nameEl.value.trim() || 'Contacto sin nombre', phone});
    }
    else if(action==='call-base'){
      const contact = contactBase.find(c=>c.id===el.dataset.id);
      if(!contact) return;
      if(contact.campaignId) state.dialer.campaignId = contact.campaignId;
      state.view='marcador';
      startCall({name:contact.name, phone:contact.phone}, contact.id);
    }
    else if(action==='end-call'){ endCall(); }
    else if(action==='toggle-mute'){ state.dialer.muted = !state.dialer.muted; renderAll(); }
    else if(action==='open-dispo'){ state.modal={type:'dispo', contact:state.dialer.contact, duration:state.dialer.elapsed}; renderModal(); }
    else if(action==='close-modal' || action==='overlay-close'){
      if(action==='overlay-close' && e.target.closest('[data-stop]')) return;
      state.modal=null; state.modalError=''; renderModal();
    }
    else if(action==='submit-dispo'){
      const sel = document.getElementById('dispo-select');
      finalizeDisposition(sel.value, document.getElementById('dispo-notes').value);
    }
    else if(action==='open-new-campaign'){ state.modal={type:'newCampaign'}; state.modalError=''; renderModal(); }
    else if(action==='open-new-number'){ state.modal={type:'newNumber'}; state.modalError=''; renderModal(); }
    else if(action==='open-new-contact'){ state.modal={type:'newContact'}; state.modalError=''; renderModal(); }
    else if(action==='open-new-admin'){ state.modal={type:'newAdmin'}; state.modalError=''; renderModal(); }
    else if(action==='open-new-agent'){ state.modal={type:'newAgent'}; state.modalError=''; renderModal(); }
    else if(action==='submit-new-campaign'){
      const name = document.getElementById('camp-name').value.trim() || 'Nueva campaña';
      const type = document.getElementById('camp-type').value;
      const mode = document.getElementById('camp-mode').value;
      const numIds = Array.from(document.querySelectorAll('input[name="camp-number"]:checked')).map(i=>i.value);
      const agIds = Array.from(document.querySelectorAll('input[name="camp-agent"]:checked')).map(i=>i.value);
      const id = uid('c');
      campaigns.push({id, name, type, dmode:mode, status:'Activa', numberIds:numIds, agentIds:agIds, total: type==='Entrante'?0:40, contacted:0});
      queues[id] = type==='Entrante' ? [] : [
        {name:'Alejandra Peña', phone:'+52 55 3345 8871'},
        {name:'Iván Camacho', phone:'+52 55 9021 4456'},
        {name:'Norma Elizondo', phone:'+52 55 6612 3390'},
      ];
      state.modal=null; state.view='campañas'; renderAll();
    }
    else if(action==='submit-new-number'){
      const [city,lada] = document.getElementById('num-city').value.split('|');
      const type = document.getElementById('num-type').value;
      const campId = document.getElementById('num-campaign').value;
      const rand = ()=> Math.floor(1000+Math.random()*8999);
      const number = lada==='800' ? `800 ${rand()} ${String(rand()).slice(0,4)}` : `+52 ${lada} ${rand()} ${rand()}`;
      const cost = type==='800 nacional' ? '$690 MXN/mes' : '$249 MXN/mes';
      const id = uid('n');
      numbers.push({id, number, city, lada, type, status: campId?'Activo':'Sin asignar', cost});
      if(campId){ const c=campaignById(campId); if(c) c.numberIds.push(id); }
      state.modal=null; state.view='numeros'; renderAll();
    }
    else if(action==='submit-new-contact'){
      const name = document.getElementById('contact-name').value.trim();
      const phone = document.getElementById('contact-phone').value.trim();
      if(!name || !phone){ state.modalError='Escribe nombre y teléfono.'; renderModal(); return; }
      const campId = document.getElementById('contact-campaign').value || null;
      contactBase.push({id:uid('b'), name, phone, campaignId:campId, status:'Pendiente', source:'Manual'});
      state.modal=null; state.modalError=''; state.view='base'; renderAll();
    }
    else if(action==='submit-new-admin'){
      const name = document.getElementById('admin-name').value.trim();
      const email = document.getElementById('admin-email').value.trim();
      const password = document.getElementById('admin-password').value;
      if(!name || !email || !password){ state.modalError='Completa nombre, correo y contraseña.'; renderModal(); return; }
      if(findUserByEmail(email)){ state.modalError='Ya existe una cuenta con ese correo.'; renderModal(); return; }
      admins.push({id:uid('ad'), name, email, password, active:true});
      state.modal=null; state.modalError=''; renderAll();
    }
    else if(action==='submit-new-agent'){
      const name = document.getElementById('agent-name').value.trim();
      const email = document.getElementById('agent-email').value.trim();
      const password = document.getElementById('agent-password').value;
      const campId = document.getElementById('agent-campaign').value || null;
      if(!name || !email || !password){ state.modalError='Completa nombre, correo y contraseña.'; renderModal(); return; }
      if(findUserByEmail(email)){ state.modalError='Ya existe una cuenta con ese correo.'; renderModal(); return; }
      const id = uid('a');
      agents.push({id, name, email, password, active:true, status:'Offline', campaignId:campId, callsToday:0, aht:'—'});
      if(campId){ const c=campaignById(campId); if(c && !c.agentIds.includes(id)) c.agentIds.push(id); }
      state.modal=null; state.modalError=''; renderAll();
    }
  });

  document.addEventListener('change', (e)=>{
    const el = e.target.closest('[data-change]');
    if(!el) return;
    const key = el.dataset.change;
    if(key==='dial-campaign'){ state.dialer.campaignId = el.value; renderAll(); }
    else if(key==='preview-agent'){ state.currentAgentId = el.value; renderAll(); }
    else if(key==='permission'){ permissions[el.dataset.key] = el.checked; renderSidebar(); renderTopbar(); renderView(); }
    else if(key==='rec-enabled'){ settings.recordingEnabled = el.checked; renderView(); }
    else if(key==='rec-notice'){ settings.recordingNotice = el.checked; persist(); }
    else if(key==='company-name'){ settings.companyName = el.value || 'Davvinci'; persist(); }
    else if(key==='agent-status'){ const a=agentById(el.dataset.id); if(a){ a.status=el.value; renderView(); } }
    else if(key==='agent-phone'){ const a=agentById(el.dataset.id); if(a){ a.phone=el.value.trim(); persist(); } }
    else if(key==='real-call-mode'){ settings.realCallMode = el.checked; renderView(); }
    else if(key==='backend-url'){ settings.backendUrl = el.value.trim(); persist(); }
    else if(key==='app-secret'){ settings.appSecret = el.value; persist(); }
    else if(key==='toggle-admin-active'){ const a=adminById(el.dataset.id); if(a){ a.active=el.checked; persist(); } }
    else if(key==='toggle-agent-active'){ const a=agentById(el.dataset.id); if(a){ a.active=el.checked; persist(); } }
    else if(key==='contact-campaign'){ const c=contactBase.find(x=>x.id===el.dataset.id); if(c){ c.campaignId=el.value||null; persist(); } }
    else if(key==='base-campaign-filter'){ state.baseFilter.campaignId = el.value; renderView(); }
    else if(key==='base-search'){ state.baseFilter.q = el.value; renderView(); }
    else if(key==='csv-upload'){
      const file = el.files && el.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const rows = parseCSV(String(reader.result||''));
        rows.forEach(r=> contactBase.push({id:uid('b'), name:r.name, phone:r.phone, campaignId:null, status:'Pendiente', source:file.name}));
        el.value = '';
        renderView();
      };
      reader.readAsText(file);
    }
  });

  document.addEventListener('input', (e)=>{
    const el = e.target.closest('[data-change="base-search"]');
    if(!el) return;
    state.baseFilter.q = el.value;
    // live-filter the table without losing focus: re-render just the view
    const active = document.activeElement === el;
    renderView();
    if(active){ const again = document.getElementById('base-search'); if(again){ again.focus(); const v=again.value; again.value=''; again.value=v; } }
  });

  /* ============================= INIT ============================= */
  renderAll();
})();
</script>
